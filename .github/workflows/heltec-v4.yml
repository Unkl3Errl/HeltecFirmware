name: Build customized WiFi LoRa 32 V4 firmware

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*-mobile.*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib libc6-dev-i386
          pip install platformio requests esptool intelhex

      - name: Run board contract tests
        run: python3 -m unittest discover -s boards/heltec-wifi-lora-32-v4 -p 'test_*.py'

      - name: Build board firmware
        run: platformio run -e heltec-wifi-lora-32-v4

      - name: Verify embedded firmware metadata
        run: |
          python3 boards/heltec-wifi-lora-32-v4/validate_firmware_metadata.py \
            Bruce-heltec-wifi-lora-32-v4.bin
          python3 boards/heltec-wifi-lora-32-v4/validate_firmware_metadata.py \
            Bruce-heltec-wifi-lora-32-v4-app.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Bruce-wifi-lora-32-v4
          path: |
            Bruce-heltec-wifi-lora-32-v4.bin
            Bruce-heltec-wifi-lora-32-v4-app.bin
          retention-days: 5
          if-no-files-found: error
