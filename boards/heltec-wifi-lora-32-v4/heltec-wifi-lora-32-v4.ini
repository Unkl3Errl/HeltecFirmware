[env:heltec-wifi-lora-32-v4]
board = heltec-wifi-lora-32-v4
board_build.partitions = custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/heltec-wifi-lora-32-v4>
build_flags =
	${env.build_flags}
	-Iboards/heltec-wifi-lora-32-v4
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DHELTEC_ANDROID_STORAGE=1
	-DBOARD_HAS_PSRAM
	; BruceNet and the phone-facing GATT server run together on this target.
	; Keep the NimBLE host's general allocations out of scarce internal DRAM.
	-include boards/heltec-wifi-lora-32-v4/nimble_psram_config.h
	-DUSB_as_HID=1
	-DDEVICE_NAME='"Heltec WiFi LoRa 32 V4"'
	-DGROVE_SDA=3
	-DGROVE_SCL=4
	-DSERIAL_RX=44
	-DSERIAL_TX=43
	-DGPS_SERIAL_RX=39
	-DGPS_SERIAL_TX=38
	-DGPS_POWER_PIN=34
	-DGPS_POWER_ACTIVE=LOW
	-DGPS_RESET_PIN=42
	-DGPS_PPS_PIN=41
	-DGPS_WAKE_PIN=40
	-DTXLED=35
	-DLED_ON=HIGH
	-DLED_OFF=LOW
	-DSDCARD_CS=-1
	-DSDCARD_SCK=-1
	-DSDCARD_MISO=-1
	-DSDCARD_MOSI=-1
	-DTFT_CS=-1
	-DTFT_DC=-1
	-DTFT_RST=-1
	-DTFT_MOSI=-1
	-DTFT_SCLK=-1
	-DTFT_BL=-1
	-DTOUCH_CS=-1
	-DBACKLIGHT=-1
	-DLORA_SCK=9
	-DLORA_MISO=11
	-DLORA_MOSI=10
	-DLORA_CS=8
	-DLORA_RST=12
	-DLORA_DIO0=14
	-DLORA_IRQ=14
	-DLORA_BUSY=13
	-DLORA_DEFAULT_SX1262=1
	-DLORA_DEFAULT_FREQUENCY_HZ=915000000.0
	-DLORA_MIN_FREQUENCY_MHZ=902.0
	-DLORA_MAX_FREQUENCY_MHZ=928.0
	-DLORA_WEB_TX_ENABLED=1
	-DLORA_WEB_TX_POWER_DBM=2
	-DLORA_WEB_TX_MAX_BYTES=64
	-DLORA_WEB_TX_COOLDOWN_MS=5000
	-DLORA_FEM_POWER=7
	-DLORA_FEM_ENABLE=2
	-DLORA_FEM_TX=5
	-DSPI_SCK_PIN=9
	-DSPI_MISO_PIN=11
	-DSPI_MOSI_PIN=10
	-DSPI_SS_PIN=8
	-DBTN_ALIAS='"PRG"'
	-DHAS_BTN=1
	-DBTN_PIN=0
	-DBTN_ACT=LOW

lib_deps =
	${env.lib_deps}
	olikraus/U8g2@2.36.5
